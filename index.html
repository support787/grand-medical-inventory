<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Grand Medical Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ee;--surface:#ffffff;--surface2:#f0ece6;--border:#ddd8d0;
  --ink:#1a1612;--ink2:#6b6560;--ink3:#a09890;
  --accent:#c8402a;--accent2:#e8956a;--green:#2a7a4a;--blue:#1a4a8a;--gold:#b8860b;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --radius:4px;--shadow:0 2px 12px rgba(0,0,0,0.08);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding-bottom:80px}
.app-header{background:var(--ink);padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
.app-logo{font-family:var(--display);font-size:22px;letter-spacing:3px;color:#fff}
.app-logo span{color:var(--accent2)}
.header-sub{font-family:var(--mono);font-size:10px;color:#666;letter-spacing:2px}
.container{max-width:600px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
#setupBanner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:20px;display:none}
#setupBanner.visible{display:block}
.setup-title{font-family:var(--display);font-size:20px;letter-spacing:2px;margin-bottom:4px}
.setup-sub{font-size:12px;color:var(--ink2);margin-bottom:16px;font-family:var(--mono)}
.setup-field{margin-bottom:10px}
.setup-field label{font-size:10px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:4px}
.setup-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface2);outline:none}
.setup-field input:focus{border-color:var(--accent)}
.setup-save{margin-top:12px;width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:16px;letter-spacing:2px;cursor:pointer}
.setup-save:hover{background:var(--accent)}
.scan-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.scan-title{font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--ink2);margin-bottom:14px}
.photo-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.photo-slot{aspect-ratio:1;border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--surface2);position:relative;overflow:hidden}
.photo-slot:hover{border-color:var(--accent)}
.photo-slot.has-photo{border-style:solid}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.slot-label{font-size:9px;font-family:var(--mono);color:var(--ink3);letter-spacing:1px;text-align:center;padding:4px}
.slot-icon{font-size:20px;margin-bottom:4px}
.remove-photo{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center}
.has-photo .remove-photo{display:flex}
.scan-btn{width:100%;padding:18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 16px rgba(200,64,42,0.3)}
.scan-btn:hover{background:#a8331f}
.scan-btn:disabled{background:var(--ink3);cursor:not-allowed}
.scan-hint{font-size:11px;font-family:var(--mono);color:var(--ink3);text-align:center;margin-top:8px;letter-spacing:1px}
.log-header{display:flex;align-items:center;justify-content:space-between}
.log-title{font-family:var(--display);font-size:22px;letter-spacing:3px}
.log-count{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.export-row{display:flex;gap:8px}
.export-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;color:var(--ink2);cursor:pointer;letter-spacing:1px}
.export-btn:hover{border-color:var(--ink);color:var(--ink)}
.part-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:cardIn 0.3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface2)}
.card-part-id{font-family:var(--display);font-size:16px;letter-spacing:2px;color:var(--accent);flex:1}
.card-timestamp{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.card-toggle{font-size:12px;color:var(--ink3);transition:transform 0.2s}
.card-delete{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px}
.card-delete:hover{color:var(--accent)}
.collapsed .card-toggle{transform:rotate(-90deg)}
.collapsed .card-body{display:none}
.card-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.photos-strip{display:flex;gap:8px;overflow-x:auto}
.photo-thumb{width:80px;height:80px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);flex-shrink:0}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.field.full{grid-column:1/-1}
.field-label{font-size:8px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);margin-bottom:4px;text-transform:uppercase}
.field-value{font-size:13px;font-weight:500;color:var(--ink);word-break:break-all;line-height:1.3}
.field-value.accent{color:var(--accent);font-family:var(--mono)}
.field-value.muted{color:var(--ink3);font-style:italic;font-weight:300}
.field-value.editable{cursor:pointer;border-bottom:1px dashed var(--border)}
.field-value.editable:hover{border-bottom-color:var(--accent);color:var(--accent)}
.field input{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);outline:none;border-bottom:2px solid var(--accent)}
.ebay-section{border-top:1px solid var(--border);padding-top:14px}
.ebay-header{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--ink3);margin-bottom:12px;text-align:center}
.ebay-card{background:linear-gradient(135deg,#f8f4ff,#f0f8ff);border:1px solid #ddd0f0;border-radius:var(--radius);padding:14px}
.ebay-title-text{font-weight:700;font-size:14px;color:var(--blue);line-height:1.3;margin-bottom:8px}
.ebay-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ebay-price{font-family:var(--display);font-size:28px;color:var(--green)}
.price-edit-btn{font-size:11px;font-family:var(--mono);color:var(--ink3);background:none;border:1px solid var(--border);border-radius:2px;padding:3px 8px;cursor:pointer}
.price-input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.price-input{flex:1;padding:8px 12px;border:2px solid var(--accent);border-radius:var(--radius);font-family:var(--display);font-size:20px;color:var(--green);outline:none}
.price-save-btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--mono);font-size:11px;cursor:pointer}
.ebay-meta{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:1px;margin-bottom:8px}
.ebay-desc{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:8px}
.ebay-ship{font-size:11px;font-family:var(--mono);color:var(--ink3)}
.ebay-list-btn{width:100%;margin-top:12px;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:18px;letter-spacing:2px;cursor:pointer}
.ebay-list-btn:hover{background:#0f3570}
.retry-btn{width:100%;padding:13px;background:var(--surface2);color:var(--ink2);border:2px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:1px}
.generating{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:16px;animation:pulse 1.2s infinite}
.empty{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:12px;padding:50px 20px;letter-spacing:1px;line-height:2;border:1px dashed var(--border);border-radius:var(--radius)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;transition:transform 0.3s;z-index:999;white-space:nowrap}
#toast.visible{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--accent)}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">GRAND <span>MEDICAL</span></div>
  <div class="header-sub">INVENTORY SCANNER</div>
</div>
<div class="container">
  <div id="setupBanner" class="visible">
    <div class="setup-title">SETUP</div>
    <div class="setup-sub">One-time configuration. Keys stored locally on this device only.</div>
    <div class="setup-field">
      <label>CLOUDFLARE WORKER URL</label>
      <input type="url" id="workerInput" placeholder="https://your-worker.workers.dev"/>
    </div>
    <div class="setup-field">
      <label>GEMINI API KEY</label>
      <input type="password" id="geminiInput" placeholder="AIza..."/>
    </div>
    <button class="setup-save" id="setupSaveBtn">SAVE &amp; START</button>
  </div>
  <div class="scan-section">
    <div class="scan-title">NEW ITEM</div>
    <div class="photo-slots" id="photoSlots"></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none"/>
    <button class="scan-btn" id="scanBtn">&#9889; ANALYZE &amp; LIST</button>
    <div class="scan-hint">Add label photo + item photos, then analyze</div>
  </div>
  <div class="log-header">
    <div class="log-title">INVENTORY</div>
    <div class="log-count" id="logCount"></div>
  </div>
  <div class="export-row">
    <button class="export-btn" id="exportCsvBtn">&#8595; EXPORT CSV</button>
    <button class="export-btn" id="exportJsonBtn">&#8595; EXPORT JSON</button>
  </div>
  <div id="partsList"></div>
</div>
<div id="toast"></div>
<script>
var STORAGE_KEY = 'gmi_v2';
var CFG_KEY = 'gmi_cfg_v2';
var PART_FIELDS = [
  {key:'partName',    label:'PART NAME',       accent:false},
  {key:'manufacturer',label:'MANUFACTURER',    accent:false},
  {key:'partNumber',  label:'PART NUMBER',     accent:true},
  {key:'serialNumber',label:'SERIAL NUMBER',   accent:true},
  {key:'model',       label:'MODEL',           accent:false},
  {key:'refCatalog',  label:'REF / CATALOG',   accent:true},
  {key:'lotNumber',   label:'LOT NUMBER',      accent:false},
  {key:'expiryDate',  label:'MFG / EXPIRY',    accent:false},
  {key:'condition',   label:'CONDITION',       accent:false}
];
var pendingPhotos = [];
var slotTarget = 0;
var log = [];

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'visible ' + (type || '');
  setTimeout(function(){ t.className = ''; }, 3000);
}

function loadLog() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
}

function saveLog() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); }
  catch(e) { showToast('Storage full — delete old items', 'error'); }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Setup
document.getElementById('setupSaveBtn').onclick = function() {
  var worker = document.getElementById('workerInput').value.trim().replace(/\/$/,'');
  var gemini = document.getElementById('geminiInput').value.trim();
  if (!worker || worker.length < 10) { showToast('Enter a valid Worker URL', 'error'); return; }
  if (!gemini || gemini.length < 10) { showToast('Enter a valid Gemini API key', 'error'); return; }
  localStorage.setItem(CFG_KEY, JSON.stringify({worker:worker, gemini:gemini}));
  document.getElementById('setupBanner').classList.remove('visible');
  showToast('Setup saved!', 'success');
};

(function() {
  var cfg = getConfig();
  if (cfg.worker && cfg.gemini) {
    document.getElementById('setupBanner').classList.remove('visible');
    document.getElementById('workerInput').value = cfg.worker;
    document.getElementById('geminiInput').value = cfg.gemini;
  }
})();

// Photo slots
var SLOT_LABELS = ['LABEL', 'FRONT', 'SIDE', 'DETAIL'];

function renderSlots() {
  var container = document.getElementById('photoSlots');
  container.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var slot = document.createElement('div');
    slot.className = 'photo-slot' + (pendingPhotos[i] ? ' has-photo' : '');
    if (pendingPhotos[i]) {
      var img = document.createElement('img');
      img.src = pendingPhotos[i].dataUrl;
      img.alt = 'photo';
      slot.appendChild(img);
      var btn = document.createElement('button');
      btn.className = 'remove-photo';
      btn.textContent = 'x';
      btn.setAttribute('data-idx', i);
      btn.onclick = function(e) {
        e.stopPropagation();
        pendingPhotos[parseInt(this.getAttribute('data-idx'))] = null;
        renderSlots();
      };
      slot.appendChild(btn);
    } else {
      var icon = document.createElement('div');
      icon.className = 'slot-icon';
      icon.textContent = i === 0 ? '🏷' : '📷';
      slot.appendChild(icon);
      var lbl = document.createElement('div');
      lbl.className = 'slot-label';
      lbl.textContent = SLOT_LABELS[i];
      slot.appendChild(lbl);
      slot.setAttribute('data-idx', i);
      slot.onclick = function() {
        var cfg = getConfig();
        if (!cfg.worker || !cfg.gemini) {
          document.getElementById('setupBanner').classList.add('visible');
          showToast('Complete setup first', 'error');
          return;
        }
        slotTarget = parseInt(this.getAttribute('data-idx'));
        document.getElementById('photoInput').click();
      };
    }
    container.appendChild(slot);
  }
}

document.getElementById('photoInput').onchange = function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  e.target.value = '';
  Promise.all([
    createThumb(file, 300, 0.75),
    resizeImg(file, 1600, 0.92)
  ]).then(function(results) {
    pendingPhotos[slotTarget] = {dataUrl: results[0], base64: results[1], mediaType: 'image/jpeg'};
    renderSlots();
  });
};

function resizeImg(file, maxPx, quality) {
  return new Promise(function(res, rej) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality).split(',')[1]);
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function createThumb(file, maxPx, quality) {
  return new Promise(function(res) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror = function(){ res(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ res(null); };
    reader.readAsDataURL(file);
  });
}

// API
function callClaude(messages, systemPrompt) {
  var cfg = getConfig();
  return fetch(cfg.worker, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({model:'claude-sonnet-4-5', max_tokens:1500, system:systemPrompt, messages:messages})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.error) throw new Error(JSON.stringify(data.error));
    return (data.content||[]).map(function(b){ return b.text||''; }).join('');
  });
}

function callGemini(parts) {
  var cfg = getConfig();
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=' + cfg.gemini, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:parts}]})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.error) throw new Error(data.error.message);
    return (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
  });
}

function extractWithGemini(photos) {
  var parts = [];
  for (var i = 0; i < photos.length; i++) {
    if (photos[i]) parts.push({inline_data:{mime_type:photos[i].mediaType, data:photos[i].base64}});
  }
  parts.push({text:'You are an expert OCR and product identification assistant. The first image is a product label. Additional images show the item itself. Read EVERY piece of text from the label carefully including rotated or angled text. Use item images to identify the product and condition. Return ONLY valid JSON with these exact keys (use "not found" if truly not visible): {"partName":"","manufacturer":"","partNumber":"","serialNumber":"","model":"","refCatalog":"","lotNumber":"","expiryDate":"","condition":"","notes":""}. partName = product name based on label AND appearance. notes = ALL other label text including addresses, voltages, standards. No markdown.'});
  return callGemini(parts).then(function(raw) {
    try { return JSON.parse(raw.replace(/```json|```/g,'').trim()); }
    catch(e) { return {partName:'Unknown', notes:raw}; }
  });
}

function buildEbayUrl(listing) {
  try {
    var price = (listing.price||'').replace(/[^0-9.]/g,'');
    return 'https://www.ebay.com/sell/listing?action=add&title=' + encodeURIComponent((listing.title||'').substring(0,80)) + '&price=' + encodeURIComponent(price);
  } catch(e) { return 'https://www.ebay.com/sell/listing'; }
}

function generateListing(part, photos) {
  var content = [];
  for (var i = 1; i < photos.length; i++) {
    if (photos[i]) content.push({type:'image', source:{type:'base64', media_type:photos[i].mediaType, data:photos[i].base64}});
  }
  var itemJson = JSON.stringify(part, null, 2);
  content.push({type:'text', text:'Create a complete eBay listing for this medical/industrial equipment. Label data: ' + itemJson + '. Generate: title (max 80 chars), eBay category path, realistic market price for used medical/industrial equipment, detailed description, shipping note, and brief price reasoning. Return ONLY valid JSON: {"title":"","category":"","price":"","suggestedPriceReason":"","condition":"Used","description":"","shippingNote":""}'});
  var sys = 'You are an expert eBay seller specializing in used medical and industrial equipment. You know current market prices. Always provide realistic competitive prices. Return ONLY valid JSON, no markdown.';
  return callClaude([{role:'user', content:content}], sys).then(function(raw) {
    try {
      var listing = JSON.parse(raw.replace(/```json|```/g,'').trim());
      listing.ebayUrl = buildEbayUrl(listing);
      return listing;
    } catch(e) { return {error:true}; }
  });
}

// Scan
document.getElementById('scanBtn').onclick = function() {
  var photos = pendingPhotos.filter(Boolean);
  if (photos.length === 0) { showToast('Add at least one photo first', 'error'); return; }
  var btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'READING LABEL...';
  extractWithGemini(pendingPhotos).then(function(extracted) {
    btn.textContent = 'GENERATING LISTING...';
    var id = 'PART-' + String(log.length+1).padStart(4,'0');
    var thumbs = pendingPhotos.map(function(p){ return p ? p.dataUrl : null; });
    var part = {id:id, scannedAt:new Date().toISOString(), thumbs:thumbs};
    var fields = ['partName','manufacturer','partNumber','serialNumber','model','refCatalog','lotNumber','expiryDate','condition','notes'];
    fields.forEach(function(k){ part[k] = extracted[k] || 'not found'; });
    part.ebayListing = null;
    log.unshift(part);
    saveLog();
    renderLog();
    return generateListing(extracted, pendingPhotos).then(function(listing) {
      part.ebayListing = listing;
    }).catch(function() {
      part.ebayListing = {error:true};
    }).then(function() {
      saveLog();
      updateEbay(part.id, part.ebayListing);
      pendingPhotos = [];
      renderSlots();
      showToast('Item scanned!', 'success');
    });
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  }).then(function() {
    btn.disabled = false;
    btn.textContent = '\u26A1 ANALYZE & LIST';
  });
};

// Render
function renderLog() {
  var list = document.getElementById('partsList');
  var count = document.getElementById('logCount');
  count.textContent = log.length ? log.length + ' item' + (log.length !== 1 ? 's' : '') : '';
  if (!log.length) {
    list.innerHTML = '<div class="empty">No items yet.<br>Add photos above and tap Analyze &amp; List.</div>';
    return;
  }
  list.innerHTML = log.map(function(p){ return cardHTML(p); }).join('');
}

function cardHTML(p) {
  var thumbs = '';
  if (p.thumbs) {
    p.thumbs.forEach(function(t) {
      if (t) thumbs += '<img class="photo-thumb" src="' + t + '" alt="photo"/>';
    });
  }
  var fields = '';
  PART_FIELDS.forEach(function(f) {
    var val = p[f.key];
    var empty = !val || val === 'not found';
    var cls = empty ? 'muted' : (f.accent ? 'accent' : '');
    fields += '<div class="field"><div class="field-label">' + f.label + '</div>' +
      '<div class="field-value ' + cls + ' editable" id="fv-' + p.id + '-' + f.key + '" data-pid="' + p.id + '" data-fkey="' + f.key + '">' +
      (empty ? 'tap to edit' : escHtml(val)) + '</div></div>';
  });
  var notes = p.notes && p.notes !== 'not found' ? '<div class="field full"><div class="field-label">NOTES</div><div class="field-value" style="font-size:11px;line-height:1.6">' + escHtml(p.notes) + '</div></div>' : '';
  return '<div class="part-card" id="card-' + p.id + '">' +
    '<div class="card-header" data-id="' + p.id + '">' +
    '<span class="card-part-id">' + p.id + '</span>' +
    '<span class="card-timestamp">' + new Date(p.scannedAt).toLocaleString() + '</span>' +
    '<span class="card-toggle">&#9662;</span>' +
    '<button class="card-delete" data-id="' + p.id + '">&#128465;</button>' +
    '</div>' +
    '<div class="card-body">' +
    (thumbs ? '<div class="photos-strip">' + thumbs + '</div>' : '') +
    '<div class="fields-grid">' + fields + notes + '</div>' +
    '<div class="ebay-section"><div class="ebay-header">— EBAY LISTING —</div>' +
    '<div id="ebay-' + p.id + '">' + ebayHTML(p.ebayListing, p.id) + '</div></div>' +
    '</div></div>';
}

function ebayHTML(listing, id) {
  if (!listing) return '<div class="generating">Generating listing...</div>';
  if (listing.error) return '<button class="retry-btn" data-id="' + id + '">&#8635; Retry listing</button>';
  var price = listing.price || '';
  return '<div class="ebay-card">' +
    '<div class="ebay-title-text">' + escHtml(listing.title||'') + '</div>' +
    '<div class="ebay-price-row">' +
    '<div class="ebay-price" id="pd-' + id + '">' + escHtml(price) + '</div>' +
    '<button class="price-edit-btn" data-id="' + id + '">&#9998; Edit price</button>' +
    '</div>' +
    '<div id="pi-' + id + '" style="display:none">' +
    '<div class="price-input-row">' +
    '<input class="price-input" id="pv-' + id + '" type="text" value="' + escHtml(price) + '" placeholder="e.g. 149.99"/>' +
    '<button class="price-save-btn" data-id="' + id + '">SAVE</button>' +
    '</div>' +
    (listing.suggestedPriceReason ? '<div style="font-size:10px;font-family:var(--mono);color:var(--ink3);margin-bottom:8px">&#128161; ' + escHtml(listing.suggestedPriceReason) + '</div>' : '') +
    '</div>' +
    '<div class="ebay-meta">' + escHtml((listing.condition||'Used') + (listing.category ? ' · ' + listing.category : '')) + '</div>' +
    '<div class="ebay-desc">' + escHtml(listing.description||'') + '</div>' +
    (listing.shippingNote ? '<div class="ebay-ship">&#128230; ' + escHtml(listing.shippingNote) + '</div>' : '') +
    '<button class="ebay-list-btn" data-id="' + id + '">LIST ON EBAY &#8594;</button>' +
    '</div>';
}

function updateEbay(id, listing) {
  var el = document.getElementById('ebay-' + id);
  if (el) el.innerHTML = ebayHTML(listing, id);
}

// Event delegation
document.getElementById('partsList').onclick = function(e) {
  var el = e.target;
  // Delete
  if (el.classList.contains('card-delete')) {
    var id = el.getAttribute('data-id');
    if (confirm('Delete this item?')) {
      log = log.filter(function(p){ return p.id !== id; });
      saveLog(); renderLog();
    }
    return;
  }
  // Toggle card
  if (el.classList.contains('card-header') || el.parentElement.classList.contains('card-header')) {
    var hdr = el.classList.contains('card-header') ? el : el.parentElement;
    var id = hdr.getAttribute('data-id');
    if (id) document.getElementById('card-' + id).classList.toggle('collapsed');
    return;
  }
  // Edit field
  if (el.classList.contains('editable')) {
    var pid = el.getAttribute('data-pid');
    var fkey = el.getAttribute('data-fkey');
    var part = log.find(function(p){ return p.id === pid; });
    var cur = part ? (part[fkey] === 'not found' ? '' : part[fkey] || '') : '';
    el.innerHTML = '<input type="text" value="' + escHtml(cur) + '"/>';
    var inp = el.querySelector('input');
    inp.focus();
    inp.onblur = function() {
      var val = this.value.trim();
      if (part) { part[fkey] = val || 'not found'; saveLog(); }
      var field = PART_FIELDS.find(function(f){ return f.key === fkey; });
      var empty = !val;
      el.className = 'field-value ' + (empty ? 'muted' : (field && field.accent ? 'accent' : '')) + ' editable';
      el.textContent = empty ? 'tap to edit' : val;
    };
    inp.onkeydown = function(e){ if(e.key==='Enter') this.blur(); };
    return;
  }
  // Edit price button
  if (el.classList.contains('price-edit-btn')) {
    var id = el.getAttribute('data-id');
    document.getElementById('pi-' + id).style.display = 'block';
    document.getElementById('pv-' + id).focus();
    return;
  }
  // Save price
  if (el.classList.contains('price-save-btn')) {
    var id = el.getAttribute('data-id');
    var val = document.getElementById('pv-' + id).value.trim();
    var part = log.find(function(p){ return p.id === id; });
    if (part && part.ebayListing) {
      part.ebayListing.price = val;
      part.ebayListing.ebayUrl = buildEbayUrl(part.ebayListing);
      saveLog();
      document.getElementById('pd-' + id).textContent = val;
      document.getElementById('pi-' + id).style.display = 'none';
      showToast('Price updated!', 'success');
    }
    return;
  }
  // Retry listing
  if (el.classList.contains('retry-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (!part) return;
    updateEbay(id, null);
    generateListing(part, []).then(function(listing) {
      part.ebayListing = listing;
      saveLog();
      updateEbay(id, listing);
    }).catch(function() {
      part.ebayListing = {error:true};
      saveLog();
      updateEbay(id, {error:true});
    });
    return;
  }
  // List on eBay
  if (el.classList.contains('ebay-list-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (part && part.ebayListing) {
      window.open(buildEbayUrl(part.ebayListing), '_blank');
      showToast('Opening eBay...', 'success');
    }
    return;
  }
};

// Export
document.getElementById('exportCsvBtn').onclick = function() {
  var headers = ['id','scannedAt','partName','manufacturer','partNumber','serialNumber','model','refCatalog','lotNumber','expiryDate','condition','notes','ebayTitle','ebayPrice','ebayCategory'];
  var rows = log.map(function(p) {
    return headers.map(function(h) {
      var v = '';
      if (h === 'ebayTitle') v = p.ebayListing && p.ebayListing.title || '';
      else if (h === 'ebayPrice') v = p.ebayListing && p.ebayListing.price || '';
      else if (h === 'ebayCategory') v = p.ebayListing && p.ebayListing.category || '';
      else v = p[h] || '';
      return '"' + String(v).replace(/"/g,'""') + '"';
    }).join(',');
  });
  dl('grand-medical-inventory.csv','text/csv',[headers.join(',')].concat(rows).join('\n'));
};

document.getElementById('exportJsonBtn').onclick = function() {
  var clean = log.map(function(p) {
    var r = {};
    Object.keys(p).forEach(function(k){ if(k!=='thumbs') r[k]=p[k]; });
    return r;
  });
  dl('grand-medical-inventory.json','application/json',JSON.stringify(clean,null,2));
};

function dl(name,type,content) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:type}));
  a.download = name; a.click();
}

// Init
log = loadLog();
renderSlots();
renderLog();
</script>
