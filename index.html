<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Grand Medical Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ee;--surface:#ffffff;--surface2:#f0ece6;--border:#ddd8d0;
  --ink:#1a1612;--ink2:#6b6560;--ink3:#a09890;
  --accent:#c8402a;--green:#2a7a4a;--blue:#1a4a8a;--gold:#b8860b;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --radius:4px;--shadow:0 2px 12px rgba(0,0,0,0.08);
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding-bottom:80px}
.app-header{background:var(--ink);padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
.app-logo{font-family:var(--display);font-size:22px;letter-spacing:3px;color:#fff}
.app-logo span{color:#e8956a}
.header-sub{font-family:var(--mono);font-size:10px;color:#666;letter-spacing:2px}
.container{max-width:600px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
#setupBanner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:20px;display:none}
#setupBanner.visible{display:block}
.setup-title{font-family:var(--display);font-size:20px;letter-spacing:2px;margin-bottom:4px}
.setup-sub{font-size:12px;color:var(--ink2);margin-bottom:16px;font-family:var(--mono)}
.setup-field{margin-bottom:10px}
.setup-field label{font-size:10px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:4px}
.setup-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface2);outline:none}
.setup-field input:focus{border-color:var(--accent)}
.setup-save{margin-top:12px;width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:16px;letter-spacing:2px;cursor:pointer}
.setup-save:hover{background:var(--accent)}
.scan-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.scan-title{font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--ink2);margin-bottom:14px}
.photo-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.photo-slot{aspect-ratio:1;border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--surface2);position:relative;overflow:hidden}
.photo-slot:hover{border-color:var(--accent)}
.photo-slot.has-photo{border-style:solid}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.slot-label{font-size:9px;font-family:var(--mono);color:var(--ink3);letter-spacing:1px;text-align:center;padding:4px}
.slot-icon{font-size:20px;margin-bottom:4px}
.remove-photo{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center}
.has-photo .remove-photo{display:flex}
.scan-btn{width:100%;padding:18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 16px rgba(200,64,42,0.3)}
.scan-btn:hover{background:#a8331f}
.scan-btn:disabled{background:var(--ink3);cursor:not-allowed}
.scan-hint{font-size:11px;font-family:var(--mono);color:var(--ink3);text-align:center;margin-top:8px;letter-spacing:1px}
.log-header{display:flex;align-items:center;justify-content:space-between}
.log-title{font-family:var(--display);font-size:22px;letter-spacing:3px}
.log-count{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.export-row{display:flex;gap:8px}
.export-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;color:var(--ink2);cursor:pointer;letter-spacing:1px}
.export-btn:hover{border-color:var(--ink);color:var(--ink)}
.part-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:cardIn 0.3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface2)}
.card-part-id{font-family:var(--display);font-size:16px;letter-spacing:2px;color:var(--accent);flex:1}
.card-timestamp{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.card-toggle{font-size:12px;color:var(--ink3);transition:transform 0.2s}
.card-delete{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px}
.card-delete:hover{color:var(--accent)}
.collapsed .card-toggle{transform:rotate(-90deg)}
.collapsed .card-body{display:none}
.card-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.photos-strip{display:flex;gap:8px;overflow-x:auto}
.photo-thumb{width:80px;height:80px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);flex-shrink:0}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.field.full{grid-column:1/-1}
.field-label{font-size:8px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);margin-bottom:4px;text-transform:uppercase}
.field-value{font-size:13px;font-weight:500;color:var(--ink);word-break:break-all;line-height:1.3}
.field-value.accent{color:var(--accent);font-family:var(--mono)}
.field-value.green{color:var(--green);font-family:var(--display);font-size:18px;letter-spacing:1px}
.field-value.muted{color:var(--ink3);font-style:italic;font-weight:300}
.field-value.editable{cursor:pointer;border-bottom:1px dashed var(--border)}
.field-value.editable:hover{border-bottom-color:var(--accent);color:var(--accent)}
.field input,.field textarea{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);outline:none;border-bottom:2px solid var(--accent);resize:vertical}
.field select{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);outline:none;border-bottom:2px solid var(--accent);cursor:pointer}
.website-section{border-top:2px solid var(--accent);padding-top:14px;margin-top:4px}
.website-header{font-family:var(--display);font-size:14px;letter-spacing:3px;color:var(--accent);margin-bottom:12px;text-align:center}
.website-fields{display:flex;flex-direction:column;gap:8px}
.website-field{background:#fff8f5;border:1px solid #f0d0c0;border-radius:var(--radius);padding:10px 12px}
.website-field label{font-size:8px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:4px;text-transform:uppercase}
.website-field select,.website-field input,.website-field textarea{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);outline:none;border-bottom:1px solid #f0d0c0}
.website-field textarea{resize:vertical;min-height:60px}
.image-urls{font-size:11px;font-family:var(--mono);color:var(--ink3);margin-top:4px;word-break:break-all;line-height:1.6}
.submit-btn{width:100%;padding:16px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 16px rgba(42,122,74,0.3);margin-top:4px}
.submit-btn:hover{background:#1f5c38}
.submit-btn:disabled{background:var(--ink3);cursor:not-allowed}
.submitted-badge{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:var(--radius);padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--green);text-align:center;letter-spacing:1px}
.ebay-section{border-top:1px solid var(--border);padding-top:14px}
.ebay-header{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--ink3);margin-bottom:12px;text-align:center}
.ebay-card{background:linear-gradient(135deg,#f8f4ff,#f0f8ff);border:1px solid #ddd0f0;border-radius:var(--radius);padding:14px}
.ebay-title-text{font-weight:700;font-size:14px;color:var(--blue);line-height:1.3;margin-bottom:8px}
.ebay-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ebay-price{font-family:var(--display);font-size:28px;color:var(--green)}
.price-edit-btn{font-size:11px;font-family:var(--mono);color:var(--ink3);background:none;border:1px solid var(--border);border-radius:2px;padding:3px 8px;cursor:pointer}
.price-input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.price-input{flex:1;padding:8px 12px;border:2px solid var(--accent);border-radius:var(--radius);font-family:var(--display);font-size:20px;color:var(--green);outline:none}
.price-save-btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--mono);font-size:11px;cursor:pointer}
.ebay-meta{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:1px;margin-bottom:8px}
.ebay-desc{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:8px}
.ebay-ship{font-size:11px;font-family:var(--mono);color:var(--ink3)}
.ebay-actions{display:flex;gap:8px;margin-top:12px}
.ebay-list-btn{flex:1;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:16px;letter-spacing:2px;cursor:pointer}
.ebay-list-btn:hover{background:#0f3570}
.copy-btn{padding:14px 16px;background:var(--surface2);color:var(--ink2);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:1px}
.retry-btn{width:100%;padding:13px;background:var(--surface2);color:var(--ink2);border:2px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:1px}
.generating{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:16px;animation:pulse 1.2s infinite}
.empty{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:12px;padding:50px 20px;letter-spacing:1px;line-height:2;border:1px dashed var(--border);border-radius:var(--radius)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;transition:transform 0.3s;z-index:999;white-space:nowrap}
#toast.visible{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--accent)}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">GRAND <span>MEDICAL</span></div>
  <div class="header-sub">INVENTORY SCANNER</div>
</div>
<div class="container">
  <div id="setupBanner" class="visible">
    <div class="setup-title">SETUP</div>
    <div class="setup-sub">One-time configuration. Keys stored locally on this device only.</div>
    <div class="setup-field">
      <label>CLOUDFLARE WORKER URL</label>
      <input type="url" id="workerInput" placeholder="https://your-worker.workers.dev"/>
    </div>
    <div class="setup-field">
      <label>GEMINI API KEY</label>
      <input type="password" id="geminiInput" placeholder="AIza..."/>

  <div class="scan-section">

    <button class="scan-btn" id="scanBtn">&#9889; ANALYZE &amp; LIST</button>

  </div>
  <div id="partsList"></div>
</div>
<div id="toast"></div>

<!-- Firebase SDKs -->
<script type="module">

import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  authDomain: "grand-medical-website.firebaseapp.com",
  projectId: "grand-medical-website",
  storageBucket: "grand-medical-website.firebasestorage.app",
  messagingSenderId: "799272313892",
  appId: "1:799272313892:web:a8dac153ce0de5a3e524b1",
  measurementId: "G-HGRE641LD7"
};

const MODALITIES = ['','CT','MRI','CATH','C-ARM','X-RAY','MAMMO','PET/CT','TUBE','SPECT/CT','ULTRASOUND','CR/PRINTER','INJECTOR','MONITOR','UPS','POWER SUPPLY','WORKSTATION','NETWORK'];

var firebaseApp = initializeApp(FIREBASE_CONFIG);
var storage = getStorage(firebaseApp);
var db = getFirestore(firebaseApp);

window.fbStorage = storage;
window.fbDb = db;
window.fbRef = ref;
window.fbUploadBytes = uploadBytes;
window.fbGetDownloadURL = getDownloadURL;
window.fbCollection = collection;
window.fbAddDoc = addDoc;

// Signal app is ready
window.firebaseReady = true;
document.dispatchEvent(new Event('firebaseReady'));

<script>
var STORAGE_KEY = 'gmi_v4';
var CFG_KEY = 'gmi_cfg_v2';

var PART_FIELDS = [
  {key:'partName',     label:'PART NAME',         accent:false, full:false},
  {key:'manufacturer', label:'MANUFACTURER',       accent:false, full:false},
  {key:'partNumber1',  label:'PART NUMBER 1',      accent:true,  full:false},
  {key:'partNumber2',  label:'PART NUMBER 2',      accent:true,  full:false},
  {key:'serialNumber', label:'SERIAL NUMBER',      accent:true,  full:false},
  {key:'model',        label:'MODEL',              accent:false, full:false},
  {key:'mfgDate',      label:'MANUFACTURE DATE',   accent:false, full:false},
  {key:'location',     label:'LOCATION',           accent:false, full:false},
  {key:'price',        label:'PRICE (USD)',        accent:false, full:false, green:true},
  {key:'comments',     label:'COMMENTS',           accent:false, full:true,  multiline:true},
  {key:'notes',        label:'NOTES',              accent:false, full:true}
];

var pendingPhotos = [];
var slotTarget = 0;
var log = [];

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'visible ' + (type || '');
  setTimeout(function(){ t.className = ''; }, 3000);
}

function loadLog() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
}

function saveLog() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); }
  catch(e) { showToast('Storage full — delete old items', 'error'); }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Setup
document.getElementById('setupSaveBtn').onclick = function() {
  var worker = document.getElementById('workerInput').value.trim().replace(/\/$/,'');
  var gemini = document.getElementById('geminiInput').value.trim();
  if (!worker || worker.length < 10) { showToast('Enter a valid Worker URL', 'error'); return; }
  if (!gemini || gemini.length < 10) { showToast('Enter a valid Gemini API key', 'error'); return; }
  localStorage.setItem(CFG_KEY, JSON.stringify({worker:worker, gemini:gemini}));
  document.getElementById('setupBanner').classList.remove('visible');
  showToast('Setup saved!', 'success');
};

(function() {
  var cfg = getConfig();
  if (cfg.worker && cfg.gemini) {
    document.getElementById('setupBanner').classList.remove('visible');
    document.getElementById('workerInput').value = cfg.worker;
    document.getElementById('geminiInput').value = cfg.gemini;
  }
})();

// Photo slots
var SLOT_LABELS = ['LABEL', 'FRONT', 'SIDE', 'DETAIL'];

function renderSlots() {
  var container = document.getElementById('photoSlots');
  container.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var slot = document.createElement('div');
    slot.className = 'photo-slot' + (pendingPhotos[i] ? ' has-photo' : '');
    if (pendingPhotos[i]) {
      var img = document.createElement('img');
      img.src = pendingPhotos[i].dataUrl;
      slot.appendChild(img);
      var btn = document.createElement('button');
      btn.className = 'remove-photo';
      btn.textContent = 'x';
      btn.setAttribute('data-idx', i);
      btn.onclick = function(e) {
        e.stopPropagation();
        pendingPhotos[parseInt(this.getAttribute('data-idx'))] = null;
        renderSlots();
      };
      slot.appendChild(btn);
    } else {
      var icon = document.createElement('div');
      icon.className = 'slot-icon';
      icon.textContent = i === 0 ? '🏷' : '📷';
      slot.appendChild(icon);
      var lbl = document.createElement('div');
      lbl.className = 'slot-label';
      lbl.textContent = SLOT_LABELS[i];
      slot.appendChild(lbl);
      slot.setAttribute('data-idx', i);
      slot.onclick = function() {
        var cfg = getConfig();
        if (!cfg.worker || !cfg.gemini) {
          document.getElementById('setupBanner').classList.add('visible');
          showToast('Complete setup first', 'error');
          return;
        }
        slotTarget = parseInt(this.getAttribute('data-idx'));
        document.getElementById('photoInput').click();
      };
    }
    container.appendChild(slot);
  }
}

document.getElementById('photoInput').onchange = function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  e.target.value = '';
  Promise.all([
    createThumb(file, 300, 0.75),
    resizeImg(file, 1600, 0.92),
    readFileAsArrayBuffer(file)
  ]).then(function(results) {
    pendingPhotos[slotTarget] = {
      dataUrl: results[0],
      base64: results[1],
      arrayBuffer: results[2],
      mediaType: 'image/jpeg',
      fileName: file.name
    };
    renderSlots();
  });
};

function readFileAsArrayBuffer(file) {
  return new Promise(function(res, rej) {
    var reader = new FileReader();
    reader.onload = function(e){ res(e.target.result); };
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });
}

function resizeImg(file, maxPx, quality) {
  return new Promise(function(res, rej) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality).split(',')[1]);
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function createThumb(file, maxPx, quality) {
  return new Promise(function(res) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror = function(){ res(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ res(null); };
    reader.readAsDataURL(file);
  });
}

// Upload photo to Firebase Storage
function uploadToFirebase(photo, partId, index) {
  return new Promise(function(res, rej) {
    if (!window.fbStorage) { rej(new Error('Firebase not ready')); return; }
    var fileName = 'parts_images/' + partId + '_' + index + '_' + Date.now() + '.jpg';
    var storageRef = window.fbRef(window.fbStorage, fileName);
    var blob = new Blob([photo.arrayBuffer], {type: 'image/jpeg'});
    window.fbUploadBytes(storageRef, blob).then(function() {
      return window.fbGetDownloadURL(storageRef);
    }).then(function(url) {
      res(url);
    }).catch(rej);
  });
}

// Upload all photos and return semicolon-joined URLs
function uploadAllPhotos(photos, partId) {
  var uploads = [];
  for (var i = 0; i < photos.length; i++) {
    if (photos[i]) uploads.push(uploadToFirebase(photos[i], partId, i));
  }
  if (uploads.length === 0) return Promise.resolve('');
  return Promise.all(uploads).then(function(urls) {
    return urls.join(';');
  });
}

// Submit to Firestore
function submitToFirestore(partId, websiteData) {
  return new Promise(function(res, rej) {
    if (!window.fbDb) { rej(new Error('Firebase not ready')); return; }
    var colRef = window.fbCollection(window.fbDb, 'products');
    window.fbAddDoc(colRef, websiteData).then(function(docRef) {
      res(docRef.id);
    }).catch(rej);
  });
}

// API
function callClaude(messages, systemPrompt) {
  var cfg = getConfig();
  return fetch(cfg.worker, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({model:'claude-sonnet-4-5', max_tokens:1500, system:systemPrompt, messages:messages})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.error) throw new Error(JSON.stringify(data.error));
    return (data.content||[]).map(function(b){ return b.text||''; }).join('');
  });
}

function callGemini(parts) {
  var cfg = getConfig();
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=' + cfg.gemini, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:parts}]})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.error) throw new Error(data.error.message);
    return (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
  });
}

function extractWithGemini(photos) {
  var parts = [];
  for (var i = 0; i < photos.length; i++) {
    if (photos[i]) parts.push({inline_data:{mime_type:photos[i].mediaType, data:photos[i].base64}});
  }
  parts.push({text:'You are an expert at reading medical and industrial equipment labels. Read all text carefully including rotated or angled text.\n\nIMPORTANT: Distinguish part numbers from serial numbers using these manufacturer patterns:\n- Philips: part numbers start with 98... or 45... (e.g. 9899 000 04701, 4512 345 67890)\n- Siemens: part numbers are typically 7-8 digits (e.g. 6638291)\n- GE: part numbers are typically 7 digits optionally followed by dash + 1-2 digits (e.g. 2131433, 5136412-2)\n- Canon/Toshiba: part numbers start with PX74-, PX71-, BSX-, or similar prefix patterns\n- Serial numbers often contain a mix of letters and numbers like "26557 M 117275"\n- REF or REF/Model fields on the label are almost always part numbers\n- SN or S/N fields are serial numbers\n- When unsure, still capture the number\n\nAlso extract the Brand as a single word OEM name only (e.g. "Philips Healthcare" -> "Philips", "GE Healthcare" -> "GE", "Siemens Healthineers" -> "Siemens").\n\nReturn ONLY valid JSON:\n{\n  "partName": "product name based on label and appearance",\n  "manufacturer": "single word brand name e.g. Philips, Siemens, GE, Canon, Toshiba, Hitachi",\n  "partNumber1": "most likely part number based on manufacturer pattern or REF field",\n  "partNumber2": "second part number if found, otherwise empty string",\n  "serialNumber": "serial number from SN field or number not matching part number pattern",\n  "model": "model name or number",\n  "mfgDate": "manufacture date if shown",\n  "price": "estimated market value USD for used condition, numbers only e.g. 1895.00",\n  "notes": "key technical specs only in plain conversational language e.g. 125kV 200mA 2.5Al filtration. Skip all compliance statements IEC references certifications addresses and boilerplate."\n}\nNo markdown.'});

  return callGemini(parts).then(function(raw) {
    try { return JSON.parse(raw.replace(/```json|```/g,'').trim()); }
    catch(e) { return {partName:'Unknown', notes:raw}; }
  });
}

function buildEbayUrl(listing) {
  try {
    var price = (listing.price||'').replace(/[^0-9.]/g,'');
    return 'https://www.ebay.com/sell/listing?action=add&title=' + encodeURIComponent((listing.title||'').substring(0,80)) + '&price=' + encodeURIComponent(price);
  } catch(e) { return 'https://www.ebay.com/sell/listing'; }
}

function generateListing(part, photos) {
  var content = [];
  for (var i = 1; i < photos.length; i++) {
    if (photos[i]) content.push({type:'image', source:{type:'base64', media_type:photos[i].mediaType, data:photos[i].base64}});
  }
  var itemJson = JSON.stringify({
    partName: part.partName, manufacturer: part.manufacturer,
    partNumber1: part.partNumber1, partNumber2: part.partNumber2,
    serialNumber: part.serialNumber, model: part.model,
    mfgDate: part.mfgDate, notes: part.notes
  }, null, 2);

  content.push({type:'text', text:'Create a professional eBay listing AND a website description for this used medical/industrial equipment.\n\nItem data:\n' + itemJson + '\n\nReturn ONLY valid JSON:\n{\n  "title": "eBay title max 80 chars, include brand model name and key part numbers",\n  "category": "specific eBay category path",\n  "price": "realistic market price numbers only e.g. 1895.00",\n  "suggestedPriceReason": "one sentence explaining price",\n  "description": "Technical 2-3 sentence parts catalog description. State model name, part numbers and key specs like voltage power filtration. No marketing no compatibility phrases no condition mentions.",\n  "websiteDescription": "Technical parts catalog entry. State model name, part numbers and key specs. No marketing or compatibility statements.",\n  "shippingNote": "brief shipping note"\n}'});

  var sys = 'You write terse technical descriptions for used medical parts listings. RULES: Only state facts from the data. Never add sentences explaining what the part does or what it is designed for. Never say compatible with, designed for, suitable for, ideal for, or any similar phrase. A good description example: Philips MRC 200 X-Ray Tube Housing. Part numbers 9890 000 85142 / 9890 000 04701. 125kV, 2.5Al filtration, 0.5/0.8 focal spots. Manufactured March 2009. Return ONLY valid JSON, no markdown.';
  return callClaude([{role:'user', content:content}], sys).then(function(raw) {
    try {
      var listing = JSON.parse(raw.replace(/```json|```/g,'').trim());
      listing.ebayUrl = buildEbayUrl(listing);
      return listing;
    } catch(e) { return {error:true}; }
  });
}

// Scan
document.getElementById('scanBtn').onclick = function() {
  var photos = pendingPhotos.filter(Boolean);
  if (photos.length === 0) { showToast('Add at least one photo first', 'error'); return; }
  var btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'UPLOADING PHOTOS...';

  var id = 'PART-' + String(log.length+1).padStart(4,'0');

  // Step 1: Upload photos to Firebase
  uploadAllPhotos(pendingPhotos, id).then(function(imageUrls) {
    btn.textContent = 'READING LABEL...';

    // Step 2: Gemini extracts label data
    return extractWithGemini(pendingPhotos).then(function(extracted) {
      btn.textContent = 'GENERATING LISTING...';

      var thumbs = pendingPhotos.map(function(p){ return p ? p.dataUrl : null; });
      var part = {id:id, scannedAt:new Date().toISOString(), thumbs:thumbs, imageUrls:imageUrls};
      var fields = ['partName','manufacturer','partNumber1','partNumber2','serialNumber','model','mfgDate','notes'];
      fields.forEach(function(k){ part[k] = extracted[k] || ''; });
      part.price = extracted.price || '';
      part.location = '';
      part.comments = '';
      part.modality = '';
      part.websiteDescription = '';
      part.ebayListing = null;
      part.submitted = false;

      log.unshift(part);
      saveLog();
      renderLog();

      // Step 3: Claude generates listings
      return generateListing(extracted, pendingPhotos).then(function(listing) {
        part.ebayListing = listing;
        if (!part.price && listing && listing.price) part.price = listing.price;
        if (listing && listing.websiteDescription) part.websiteDescription = listing.websiteDescription;
        // Set comments = Claude | $price
        part.comments = 'Claude | $' + (part.price || '');
      }).catch(function() {
        part.ebayListing = {error:true};
      }).then(function() {
        saveLog();
        renderLog();
        pendingPhotos = [];
        renderSlots();
        showToast('Item scanned!', 'success');
      });
    });
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  }).then(function() {
    btn.disabled = false;
    btn.textContent = '\u26A1 ANALYZE & LIST';
  });
};

// Render
function renderLog() {
  var list = document.getElementById('partsList');
  var count = document.getElementById('logCount');
  count.textContent = log.length ? log.length + ' item' + (log.length !== 1 ? 's' : '') : '';
  if (!log.length) {
    list.innerHTML = '<div class="empty">No items yet.<br>Add photos above and tap Analyze &amp; List.</div>';
    return;
  }
  list.innerHTML = log.map(function(p){ return cardHTML(p); }).join('');
}

function cardHTML(p) {
  var thumbs = '';
  if (p.thumbs) {
    p.thumbs.forEach(function(t) {
      if (t) thumbs += '<img class="photo-thumb" src="' + t + '" alt="photo"/>';
    });
  }

  var fields = '';
  PART_FIELDS.forEach(function(f) {
    var val = p[f.key];
    var empty = !val || val === '';
    var cls = '';
    if (f.green) cls = empty ? 'muted' : 'green';
    else if (f.accent) cls = empty ? 'muted' : 'accent';
    else cls = empty ? 'muted' : '';
    var displayVal = empty ? 'tap to edit' : escHtml(val);
    if (f.green && !empty) displayVal = '$' + escHtml(val);
    var fieldCls = 'field' + (f.full ? ' full' : '');
    fields += '<div class="' + fieldCls + '"><div class="field-label">' + f.label + '</div>' +
      '<div class="field-value ' + cls + ' editable" id="fv-' + p.id + '-' + f.key + '" data-pid="' + p.id + '" data-fkey="' + f.key + '" data-multiline="' + (f.multiline ? '1' : '0') + '">' +
      displayVal + '</div></div>';
  });

  // Website submission section
  var modalityOptions = (window.MODALITIES || []).map(function(m) {
    return '<option value="' + m + '"' + (p.modality === m ? ' selected' : '') + '>' + (m || '-- Select Modality --') + '</option>';
  }).join('');

  var websiteSection = '';
  if (p.submitted) {
    websiteSection = '<div class="website-section">' +
      '<div class="submitted-badge">&#10003; Submitted to grandmedicalequipment.com</div>' +
      '</div>';
  } else {
    websiteSection = '<div class="website-section">' +
      '<div class="website-header">SUBMIT TO WEBSITE</div>' +
      '<div class="website-fields">' +
      '<div class="website-field"><label>MODALITY</label>' +
      '<select id="ws-modality-' + p.id + '"><' + modalityOptions + '</select></div>' +
      '<div class="website-field"><label>BRAND</label>' +
      '<input type="text" id="ws-brand-' + p.id + '" value="' + escHtml(p.manufacturer||'') + '"/></div>' +
      '<div class="website-field"><label>PART NUMBER</label>' +
      '<input type="text" id="ws-pn-' + p.id + '" value="' + escHtml((p.partNumber1 && p.partNumber2 ? p.partNumber1 + ' / ' + p.partNumber2 : p.partNumber1 || p.partNumber2 || '')) + '"/></div>' +
      '<div class="website-field"><label>DESCRIPTION</label>' +
      '<textarea id="ws-desc-' + p.id + '" rows="3">' + escHtml(p.websiteDescription || p.notes || '') + '</textarea></div>' +
      '<div class="website-field"><label>IMAGE URLS</label>' +
      '<div class="image-urls">' + escHtml(p.imageUrls || 'No images uploaded') + '</div></div>' +
      '<div class="website-field"><label>LOCATION</label>' +
      '<input type="text" id="ws-loc-' + p.id + '" value="' + escHtml(p.location||'') + '" placeholder="e.g. Shelf A3"/></div>' +
      '<div class="website-field"><label>COMMENTS</label>' +
      '<input type="text" id="ws-comments-' + p.id + '" value="' + escHtml(p.comments||'') + '"/></div>' +
      '</div>' +
      '<button class="submit-btn" data-id="' + p.id + '" id="submit-btn-' + p.id + '">&#8679; SUBMIT TO WEBSITE</button>' +
      '</div>';
  }

  return '<div class="part-card" id="card-' + p.id + '">' +
    '<div class="card-header" data-id="' + p.id + '">' +
    '<span class="card-part-id">' + p.id + '</span>' +
    '<span class="card-timestamp">' + new Date(p.scannedAt).toLocaleString() + '</span>' +
    '<span class="card-toggle">&#9662;</span>' +
    '<button class="card-delete" data-id="' + p.id + '">&#128465;</button>' +
    '</div>' +
    '<div class="card-body">' +
    (thumbs ? '<div class="photos-strip">' + thumbs + '</div>' : '') +
    '<div class="fields-grid">' + fields + '</div>' +
    websiteSection +
    '<div class="ebay-section"><div class="ebay-header">— EBAY LISTING —</div>' +
    '<div id="ebay-' + p.id + '">' + ebayHTML(p.ebayListing, p.id) + '</div></div>' +
    '</div></div>';
}

function ebayHTML(listing, id) {
  if (!listing) return '<div class="generating">Generating listing...</div>';
  if (listing.error) return '<button class="retry-btn" data-id="' + id + '">&#8635; Retry listing</button>';
  var price = listing.price || '';
  return '<div class="ebay-card">' +
    '<div class="ebay-title-text">' + escHtml(listing.title||'') + '</div>' +
    '<div class="ebay-price-row">' +
    '<div class="ebay-price" id="pd-' + id + '">$' + escHtml(price) + '</div>' +
    '<button class="price-edit-btn" data-id="' + id + '">&#9998; Edit</button>' +
    '</div>' +
    '<div id="pi-' + id + '" style="display:none">' +
    '<div class="price-input-row">' +
    '<input class="price-input" id="pv-' + id + '" type="text" value="' + escHtml(price) + '" placeholder="e.g. 1895.00"/>' +
    '<button class="price-save-btn" data-id="' + id + '">SAVE</button>' +
    '</div>' +
    (listing.suggestedPriceReason ? '<div style="font-size:10px;font-family:var(--mono);color:var(--ink3);margin-bottom:8px">&#128161; ' + escHtml(listing.suggestedPriceReason) + '</div>' : '') +
    '</div>' +
    '<div class="ebay-meta">' + escHtml((listing.condition||'Used') + (listing.category ? ' · ' + listing.category : '')) + '</div>' +
    '<div class="ebay-desc">' + escHtml(listing.description||'') + '</div>' +
    (listing.shippingNote ? '<div class="ebay-ship">&#128230; ' + escHtml(listing.shippingNote) + '</div>' : '') +
    '<div class="ebay-actions">' +
    '<button class="copy-btn" data-id="' + id + '">&#128203; Copy</button>' +
    '<button class="ebay-list-btn" data-id="' + id + '">LIST ON EBAY &#8594;</button>' +
    '</div></div>';
}

function updateEbay(id, listing) {
  var el = document.getElementById('ebay-' + id);
  if (el) el.innerHTML = ebayHTML(listing, id);
}

// Event delegation
document.getElementById('partsList').onclick = function(e) {
  var el = e.target;

  if (el.classList.contains('card-delete')) {
    var id = el.getAttribute('data-id');
    if (confirm('Delete this item?')) {
      log = log.filter(function(p){ return p.id !== id; });
      saveLog(); renderLog();
    }
    return;
  }

  if (el.classList.contains('card-header') || el.parentElement.classList.contains('card-header')) {
    var hdr = el.classList.contains('card-header') ? el : el.parentElement;
    var id = hdr.getAttribute('data-id');
    if (id) document.getElementById('card-' + id).classList.toggle('collapsed');
    return;
  }

  if (el.classList.contains('editable')) {
    var pid = el.getAttribute('data-pid');
    var fkey = el.getAttribute('data-fkey');
    var multiline = el.getAttribute('data-multiline') === '1';
    var part = log.find(function(p){ return p.id === pid; });
    var cur = part ? (part[fkey] || '') : '';
    if (multiline) {
      el.innerHTML = '<textarea rows="3">' + escHtml(cur) + '</textarea>';
      var inp = el.querySelector('textarea');
      inp.focus();
      inp.onblur = function() { saveFieldVal(pid, fkey, this.value, el); };
    } else {
      el.innerHTML = '<input type="text" value="' + escHtml(cur) + '"/>';
      var inp = el.querySelector('input');
      inp.focus();
      inp.onblur = function() { saveFieldVal(pid, fkey, this.value, el); };
      inp.onkeydown = function(e){ if(e.key==='Enter') this.blur(); };
    }
    return;
  }

  if (el.classList.contains('price-edit-btn')) {
    var id = el.getAttribute('data-id');
    document.getElementById('pi-' + id).style.display = 'block';
    document.getElementById('pv-' + id).focus();
    return;
  }

  if (el.classList.contains('price-save-btn')) {
    var id = el.getAttribute('data-id');
    var val = document.getElementById('pv-' + id).value.trim();
    var part = log.find(function(p){ return p.id === id; });
    if (part && part.ebayListing) {
      part.ebayListing.price = val;
      part.price = val;
      part.comments = 'Claude | $' + val;
      part.ebayListing.ebayUrl = buildEbayUrl(part.ebayListing);
      saveLog();
      document.getElementById('pd-' + id).textContent = '$' + val;
      document.getElementById('pi-' + id).style.display = 'none';
      var priceEl = document.getElementById('fv-' + id + '-price');
      if (priceEl) { priceEl.className = 'field-value green editable'; priceEl.textContent = '$' + val; }
      var commentsEl = document.getElementById('fv-' + id + '-comments');
      if (commentsEl) { commentsEl.textContent = 'Claude | $' + val; }
      var wsComments = document.getElementById('ws-comments-' + id);
      if (wsComments) wsComments.value = 'Claude | $' + val;
      showToast('Price updated!', 'success');
    }
    return;
  }

  if (el.classList.contains('copy-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (part && part.ebayListing) {
      var text = 'TITLE: ' + (part.ebayListing.title||'') + '\n\nPRICE: $' + (part.ebayListing.price||'') +
        '\nCATEGORY: ' + (part.ebayListing.category||'') +
        '\n\nDESCRIPTION:\n' + (part.ebayListing.description||'') +
        '\n\nSHIPPING: ' + (part.ebayListing.shippingNote||'');
      navigator.clipboard.writeText(text).then(function(){
        showToast('Listing copied!', 'success');
      }).catch(function(){
        showToast('Copy failed', 'error');
      });
    }
    return;
  }

  if (el.classList.contains('retry-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (!part) return;
    updateEbay(id, null);
    generateListing(part, []).then(function(listing) {
      part.ebayListing = listing;
      saveLog(); updateEbay(id, listing);
    }).catch(function() {
      part.ebayListing = {error:true};
      saveLog(); updateEbay(id, {error:true});
    });
    return;
  }

  if (el.classList.contains('ebay-list-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (part && part.ebayListing) {
      window.open(buildEbayUrl(part.ebayListing), '_blank');
      showToast('Opening eBay...', 'success');
    }
    return;
  }

  // Submit to website
  if (el.classList.contains('submit-btn')) {
    var id = el.getAttribute('data-id');
    var part = log.find(function(p){ return p.id === id; });
    if (!part) return;

    var modality = document.getElementById('ws-modality-' + id).value;
    if (!modality) { showToast('Please select a modality first', 'error'); return; }

    var brand = document.getElementById('ws-brand-' + id).value.trim();
    var pn = document.getElementById('ws-pn-' + id).value.trim();
    var desc = document.getElementById('ws-desc-' + id).value.trim();
    var loc = document.getElementById('ws-loc-' + id).value.trim();
    var comments = document.getElementById('ws-comments-' + id).value.trim();

    var websiteData = {
      MODALITY: modality,
      MODELITY: modality,
      MANUFACTURER: brand.toUpperCase(),
      BRAND: brand.toUpperCase(),
      'PART NUMBER': pn,
      DESCRIPTION: desc,
      IMAGE: part.imageUrls ? part.imageUrls.split(';')[0] : '',
      IMAGES: part.imageUrls || '',
      LOCATION: loc,
      COMMENTS: comments,
      PRICE: part.price || '',
      createdAt: new Date().toISOString()
    };

    el.disabled = true;
    el.textContent = 'SUBMITTING...';

    submitToFirestore(id, websiteData).then(function(docId) {
      part.submitted = true;
      part.firestoreId = docId;
      saveLog();
      renderLog();
      showToast('Submitted to website!', 'success');
    }).catch(function(err) {
      el.disabled = false;
      el.textContent = '\u8679 SUBMIT TO WEBSITE';
      showToast('Submit failed: ' + err.message, 'error');
    });
    return;
  }
};

function saveFieldVal(pid, fkey, value, el) {
  var part = log.find(function(p){ return p.id === pid; });
  if (!part) return;
  part[fkey] = value;
  // Keep comments in sync with price
  if (fkey === 'price') {
    part.comments = 'Claude | $' + value;
    var commentsEl = document.getElementById('fv-' + pid + '-comments');
    if (commentsEl && !commentsEl.querySelector('input')) commentsEl.textContent = 'Claude | $' + value;
    var wsComments = document.getElementById('ws-comments-' + pid);
    if (wsComments) wsComments.value = 'Claude | $' + value;
  }
  saveLog();
  var field = PART_FIELDS.find(function(f){ return f.key === fkey; });
  var empty = !value;
  var cls = '';
  if (field && field.green) cls = empty ? 'muted' : 'green';
  else if (field && field.accent) cls = empty ? 'muted' : 'accent';
  else cls = empty ? 'muted' : '';
  el.className = 'field-value ' + cls + ' editable';
  if (field && field.green && !empty) el.textContent = '$' + value;
  else el.textContent = empty ? 'tap to edit' : value;
  el.setAttribute('data-pid', pid);
  el.setAttribute('data-fkey', fkey);
  el.setAttribute('data-multiline', (field && field.multiline) ? '1' : '0');
}

// Export
document.getElementById('exportCsvBtn').onclick = function() {
  var headers = ['id','scannedAt','partName','manufacturer','partNumber1','partNumber2','serialNumber','model','mfgDate','location','price','comments','notes','imageUrls','ebayTitle','ebayPrice','ebayCategory'];
  var rows = log.map(function(p) {
    return headers.map(function(h) {
      var v = '';
      if (h === 'ebayTitle') v = p.ebayListing && p.ebayListing.title || '';
      else if (h === 'ebayPrice') v = p.ebayListing && p.ebayListing.price || '';
      else if (h === 'ebayCategory') v = p.ebayListing && p.ebayListing.category || '';
      else v = p[h] || '';
      return '"' + String(v).replace(/"/g,'""') + '"';
    }).join(',');
  });
  dl('grand-medical-inventory.csv','text/csv',[headers.join(',')].concat(rows).join('\n'));
};

document.getElementById('exportJsonBtn').onclick = function() {
  var clean = log.map(function(p) {
    var r = {};
    Object.keys(p).forEach(function(k){ if(k!=='thumbs') r[k]=p[k]; });
    return r;
  });
  dl('grand-medical-inventory.json','application/json',JSON.stringify(clean,null,2));
};

function dl(name,type,content) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:type}));
  a.download = name; a.click();
}

// Init
log = loadLog();
renderSlots();
renderLog();
</script>
