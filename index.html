<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Grand Medical Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ee;
  --surface:#ffffff;
  --surface2:#f0ece6;
  --border:#ddd8d0;
  --ink:#1a1612;
  --ink2:#6b6560;
  --ink3:#a09890;
  --accent:#c8402a;
  --accent2:#e8956a;
  --green:#2a7a4a;
  --blue:#1a4a8a;
  --gold:#b8860b;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --display:'Bebas Neue',sans-serif;
  --radius:4px;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding-bottom:80px}

/* Header */
.app-header{background:var(--ink);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
.app-logo{font-family:var(--display);font-size:22px;letter-spacing:3px;color:#fff}
.app-logo span{color:var(--accent2)}
.header-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:2px}

.container{max-width:600px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}

/* Setup banner */
#setupBanner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:20px;display:none}
#setupBanner.visible{display:block}
.setup-title{font-family:var(--display);font-size:20px;letter-spacing:2px;color:var(--ink);margin-bottom:4px}
.setup-sub{font-size:12px;color:var(--ink2);margin-bottom:16px;font-family:var(--mono)}
.setup-grid{display:flex;flex-direction:column;gap:10px}
.setup-field label{font-size:10px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:4px}
.setup-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface2);outline:none}
.setup-field input:focus{border-color:var(--accent)}
.setup-save{margin-top:12px;width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:16px;letter-spacing:2px;cursor:pointer;transition:background 0.2s}
.setup-save:hover{background:var(--accent)}

/* Scan section */
.scan-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.scan-title{font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--ink2);margin-bottom:14px}

.photo-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.photo-slot{aspect-ratio:1;border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;background:var(--surface2);position:relative;overflow:hidden}
.photo-slot:hover{border-color:var(--accent);background:#fdf8f5}
.photo-slot.has-photo{border-style:solid;border-color:var(--border)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .slot-label{font-size:9px;font-family:var(--mono);color:var(--ink3);letter-spacing:1px;text-align:center;padding:4px}
.photo-slot .slot-icon{font-size:20px;margin-bottom:4px}
.photo-slot .remove-photo{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.photo-slot.has-photo .remove-photo{display:flex}

.scan-btn{width:100%;padding:18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:20px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(200,64,42,0.3)}
.scan-btn:hover{background:#a8331f;transform:translateY(-1px)}
.scan-btn:active{transform:translateY(0)}
.scan-btn:disabled{background:var(--ink3);cursor:not-allowed;transform:none;box-shadow:none}
.scan-btn.processing{animation:btnPulse 1s infinite}
@keyframes btnPulse{0%,100%{opacity:1}50%{opacity:0.7}}

.scan-hint{font-size:11px;font-family:var(--mono);color:var(--ink3);text-align:center;margin-top:8px;letter-spacing:1px}

/* Log header */
.log-header{display:flex;align-items:center;justify-content:space-between}
.log-title{font-family:var(--display);font-size:22px;letter-spacing:3px;color:var(--ink)}
.log-count{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:1px}
.export-row{display:flex;gap:8px}
.export-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;color:var(--ink2);cursor:pointer;letter-spacing:1px;transition:all 0.2s}
.export-btn:hover{border-color:var(--ink);color:var(--ink)}

/* Part card */
.part-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:cardIn 0.3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface2)}
.card-part-id{font-family:var(--display);font-size:16px;letter-spacing:2px;color:var(--accent);flex:1}
.card-timestamp{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.card-toggle{font-size:12px;color:var(--ink3);transition:transform 0.2s}
.card-delete{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px;transition:color 0.2s}
.card-delete:hover{color:var(--accent)}
.collapsed .card-toggle{transform:rotate(-90deg)}
.collapsed .card-body{display:none}

.card-body{padding:16px;display:flex;flex-direction:column;gap:14px}

/* Photos strip */
.photos-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photo-thumb{width:80px;height:80px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);flex-shrink:0}

/* Fields */
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.field.full{grid-column:1/-1}
.field-label{font-size:8px;font-family:var(--mono);letter-spacing:2px;color:var(--ink3);margin-bottom:4px;text-transform:uppercase}
.field-value{font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);word-break:break-all;line-height:1.3}
.field-value.accent{color:var(--accent);font-family:var(--mono)}
.field-value.muted{color:var(--ink3);font-style:italic;font-weight:300}
.field-value.editable{cursor:pointer;border-bottom:1px dashed var(--border)}
.field-value.editable:hover{border-bottom-color:var(--accent);color:var(--accent)}
.field input{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink);outline:none;border-bottom:2px solid var(--accent)}

/* eBay section */
.ebay-section{border-top:1px solid var(--border);padding-top:14px}
.ebay-header{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--ink3);margin-bottom:12px;text-align:center}

.ebay-card{background:linear-gradient(135deg,#f8f4ff 0%,#f0f8ff 100%);border:1px solid #ddd0f0;border-radius:var(--radius);padding:14px}
.ebay-title{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--blue);line-height:1.3;margin-bottom:8px}
.ebay-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ebay-price{font-family:var(--display);font-size:28px;color:var(--green);letter-spacing:1px}
.price-edit-btn{font-size:11px;font-family:var(--mono);color:var(--ink3);background:none;border:1px solid var(--border);border-radius:2px;padding:3px 8px;cursor:pointer;transition:all 0.2s}
.price-edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.price-input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.price-input{flex:1;padding:8px 12px;border:2px solid var(--accent);border-radius:var(--radius);font-family:var(--display);font-size:20px;color:var(--green);outline:none}
.price-save{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--mono);font-size:11px;cursor:pointer}
.ebay-meta{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:1px;margin-bottom:8px}
.ebay-desc{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:8px}
.ebay-ship{font-size:11px;font-family:var(--mono);color:var(--ink3)}

.ebay-list-btn{width:100%;margin-top:12px;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-family:var(--display);font-size:18px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(26,74,138,0.3)}
.ebay-list-btn:hover{background:#0f3570;transform:translateY(-1px)}

.retry-btn{width:100%;padding:13px;background:var(--surface2);color:var(--ink2);border:2px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:1px;transition:all 0.2s}
.retry-btn:hover{border-color:var(--ink);color:var(--ink)}

.generating{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:16px;animation:btnPulse 1.2s infinite}

.empty{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:12px;padding:50px 20px;letter-spacing:1px;line-height:2;border:1px dashed var(--border);border-radius:var(--radius)}

/* Status toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;transition:transform 0.3s;z-index:999;white-space:nowrap}
#toast.visible{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--accent)}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="app-logo">GRAND <span>MEDICAL</span></div>
    <div class="header-sub">INVENTORY SCANNER</div>
  </div>
</div>

<div class="container">

  <!-- Setup -->
  <div id="setupBanner" class="visible">
    <div class="setup-title">SETUP</div>
    <div class="setup-sub">One-time configuration. Your keys are stored locally on this device only.</div>
    <div class="setup-grid">
      <div class="setup-field">
        <label>CLOUDFLARE WORKER URL</label>
        <input type="url" id="workerInput" placeholder="https://your-worker.workers.dev"/>
      </div>
      <div class="setup-field">
        <label>GEMINI API KEY</label>
        <input type="password" id="geminiInput" placeholder="AIza..."/>
      </div>
    </div>
    <button class="setup-save" onclick="saveSetup()">SAVE &amp; START</button>
  </div>

  <!-- Scan -->
  <div class="scan-section">
    <div class="scan-title">NEW ITEM</div>
    <div class="photo-slots" id="photoSlots"></div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"/>
    <button class="scan-btn" id="scanBtn" onclick="startScan()">⚡ ANALYZE &amp; LIST</button>
    <div class="scan-hint">Add label photo + item photos, then analyze</div>
  </div>

  <!-- Log -->
  <div class="log-header">
    <div class="log-title">INVENTORY</div>
    <div class="log-count" id="logCount"></div>
  </div>
  <div class="export-row">
    <button class="export-btn" onclick="exportCSV()">↓ EXPORT CSV</button>
    <button class="export-btn" onclick="exportJSON()">↓ EXPORT JSON</button>
  </div>
  <div id="partsList"></div>

</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'gmi_inventory_v1';
const CFG_KEY = 'gmi_config_v1';

const PART_FIELDS = [
  {key:'partName',    label:'PART NAME',        accent:false},
  {key:'manufacturer',label:'MANUFACTURER',      accent:false},
  {key:'partNumber',  label:'PART NUMBER',       accent:true},
  {key:'serialNumber',label:'SERIAL NUMBER',     accent:true},
  {key:'model',       label:'MODEL',             accent:false},
  {key:'refCatalog',  label:'REF / CATALOG',     accent:true},
  {key:'lotNumber',   label:'LOT NUMBER',        accent:false},
  {key:'expiryDate',  label:'MFG / EXPIRY DATE', accent:false},
  {key:'condition',   label:'CONDITION',         accent:false},
];

// ── Config ─────────────────────────────────────────────────────────
function getConfig() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch { return {}; }
}
function saveSetup() {
  const worker = document.getElementById('workerInput').value.trim().replace(/\/$/,'');
  const gemini = document.getElementById('geminiInput').value.trim();
  if (!worker.startsWith('http')) { showToast('Enter a valid Worker URL', 'error'); return; }
  if (gemini.length < 10) { showToast('Enter a valid Gemini API key', 'error'); return; }
  localStorage.setItem(CFG_KEY, JSON.stringify({worker, gemini}));
  document.getElementById('setupBanner').classList.remove('visible');
  showToast('Setup saved!', 'success');
}
(function initConfig() {
  const cfg = getConfig();
  if (cfg.worker && cfg.gemini) {
    document.getElementById('setupBanner').classList.remove('visible');
    document.getElementById('workerInput').value = cfg.worker;
    document.getElementById('geminiInput').value = cfg.gemini;
  }
})();

// ── Storage ────────────────────────────────────────────────────────
function loadLog() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch { return []; } }
function saveLog(l) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); }
  catch(e) { showToast('Storage full — delete old items', 'error'); }
}
let log = loadLog();

// ── Photo slots ────────────────────────────────────────────────────
let pendingPhotos = []; // {dataUrl, base64, mediaType}
let slotClickTarget = -1;

const SLOT_LABELS = ['LABEL\nPHOTO', 'ITEM\nFRONT', 'ITEM\nSIDE', 'DETAIL'];

function renderSlots() {
  const container = document.getElementById('photoSlots');
  container.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement('div');
    slot.className = 'photo-slot' + (pendingPhotos[i] ? ' has-photo' : '');
    if (pendingPhotos[i]) {
      slot.innerHTML = \`<img src="\${pendingPhotos[i].dataUrl}" alt="photo \${i+1}"/>
        <button class="remove-photo" onclick="removePhoto(event,\${i})">×</button>\`;
    } else {
      slot.innerHTML = \`<div class="slot-icon">\${i===0?'🏷':'📷'}</div>
        <div class="slot-label">\${SLOT_LABELS[i].replace('\\n','<br>')}</div>\`;
      slot.onclick = () => triggerPhotoInput(i);
    }
    container.appendChild(slot);
  }
}

function triggerPhotoInput(slotIndex) {
  const cfg = getConfig();
  if (!cfg.worker || !cfg.gemini) {
    document.getElementById('setupBanner').classList.add('visible');
    showToast('Please complete setup first', 'error');
    return;
  }
  slotClickTarget = slotIndex;
  document.getElementById('photoInput').click();
}

document.getElementById('photoInput').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  const [dataUrl, base64] = await Promise.all([
    createThumbnail(file, 300, 0.75),
    resizeImage(file, 1600, 0.92)
  ]);
  pendingPhotos[slotClickTarget] = { dataUrl, base64, mediaType: 'image/jpeg' };
  renderSlots();
});

function removePhoto(e, i) {
  e.stopPropagation();
  pendingPhotos[i] = null;
  renderSlots();
}

// ── Image utils ────────────────────────────────────────────────────
function resizeImage(file, maxPx, quality) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality).split(',')[1]);
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function createThumbnail(file, maxPx, quality) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxPx/img.width, maxPx/img.height, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio);
        canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror = () => res(null);
      img.src = e.target.result;
    };
    reader.onerror = () => res(null);
    reader.readAsDataURL(file);
  });
}

// ── API calls ──────────────────────────────────────────────────────
async function callClaude(messages, systemPrompt) {
  const cfg = getConfig();
  const res = await fetch(cfg.worker, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1500,
      system: systemPrompt,
      messages
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(JSON.stringify(data.error));
  return (data.content||[]).map(b=>b.text||'').join('');
}

async function callGemini(parts) {
  const cfg = getConfig();
  const res = await fetch(
    \`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=\${cfg.gemini}\`,
    {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts}]})
    }
  );
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function extractWithGemini(photos) {
  const parts = [];
  // Add all photos
  for (const p of photos) {
    if (p) parts.push({inline_data:{mime_type:p.mediaType, data:p.base64}});
  }
  parts.push({text: \`You are an expert OCR and product identification assistant. 
  
The first image is a product label. Additional images show the item itself.

1. Read EVERY piece of text from the label image carefully, including rotated, angled, or partially visible text.
2. Use the item images to identify what the product looks like and its condition.

Return ONLY valid JSON with these exact keys (use "not found" if truly not visible):
{
  "partName": "product name or description based on label text AND what item looks like",
  "manufacturer": "company name from label",
  "partNumber": "REF, REF/Model, Part No, P/N value",
  "serialNumber": "SN, S/N, Serial value",
  "model": "model name or number",
  "refCatalog": "secondary REF or catalog number",
  "lotNumber": "LOT, Lot No value",
  "expiryDate": "manufacture date or expiry date",
  "condition": "describe condition based on item photos - Used/Good, Used/Fair, etc",
  "notes": "ALL other text from label: addresses, voltages, standards, certifications, warnings, service codes"
}

Be thorough and precise. Include partial reads with best interpretation. No markdown.\`});
  
  const raw = await callGemini(parts);
  try { return JSON.parse(raw.replace(/\`\`\`json|\`\`\`/g,'').trim()); }
  catch { return {partName:'Unknown', notes:raw}; }
}

async function generateListingWithClaude(part, photos) {
  const content = [];
  
  // Add item photos (not label) for visual context
  for (let i = 1; i < photos.length; i++) {
    if (photos[i]) content.push({type:'image', source:{type:'base64', media_type:photos[i].mediaType, data:photos[i].base64}});
  }
  
  content.push({type:'text', text:\`Create a complete eBay listing for this medical/industrial equipment item.

Item data extracted from label:
\${JSON.stringify(part, null, 2)}

Based on the item photos and label data, generate:
1. A compelling eBay title (max 80 chars) that includes brand, model, key specs
2. The most specific eBay category path for this item
3. Suggested price based on typical market value for this type of used medical/industrial equipment (be realistic)
4. A detailed professional description for eBay
5. Appropriate shipping note

Return ONLY valid JSON, no markdown:
{
  "title": "",
  "category": "",
  "price": "",
  "suggestedPriceReason": "brief explanation of how you estimated the price",
  "condition": "Used",
  "description": "",
  "shippingNote": "",
  "ebayUrl": ""
}\`});

  const sys = \`You are an expert eBay seller specializing in medical and industrial equipment. 
You know current market prices for used medical devices, X-ray equipment, monitors, lab equipment, etc.
Always provide realistic competitive prices. Return ONLY valid JSON.\`;

  const raw = await callClaude([{role:'user', content}], sys);
  try { 
    const listing = JSON.parse(raw.replace(/\`\`\`json|\`\`\`/g,'').trim());
    // Build eBay pre-fill URL
    listing.ebayUrl = buildEbayUrl(listing);
    return listing;
  }
  catch { return {error:true}; }
}

function buildEbayUrl(listing) {
  const params = new URLSearchParams({
    title: (listing.title||'').substring(0,80),
    description: listing.description||'',
    price: (listing.price||'').replace(/[^0-9.]/g,''),
    condition: '3000', // Used
  });
  return \`https://www.ebay.com/sell/listing?action=add&\${params.toString()}\`;
}

// ── Main scan flow ─────────────────────────────────────────────────
async function startScan() {
  const photos = pendingPhotos.filter(Boolean);
  if (photos.length === 0) {
    showToast('Add at least one photo first', 'error');
    return;
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.className = 'scan-btn processing';
  btn.textContent = '⏳ READING LABEL...';

  try {
    // Step 1: Gemini reads label
    const extracted = await extractWithGemini(pendingPhotos);
    
    btn.textContent = '⏳ GENERATING LISTING...';

    const id = 'PART-' + String(log.length+1).padStart(4,'0');
    const thumbs = pendingPhotos.map(p => p ? p.dataUrl : null);
    
    const part = {
      id,
      scannedAt: new Date().toISOString(),
      thumbs,
      ...extracted,
      ebayListing: null
    };

    log.unshift(part);
    saveLog(log);
    renderLog();

    // Step 2: Claude generates listing
    try {
      part.ebayListing = await generateListingWithClaude(extracted, pendingPhotos);
    } catch {
      part.ebayListing = {error:true};
    }
    saveLog(log);
    updateCardEbay(part.id, part.ebayListing);

    // Clear photos
    pendingPhotos = [];
    renderSlots();
    showToast('Item scanned successfully!', 'success');

  } catch(err) {
    console.error(err);
    showToast('Scan failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.className = 'scan-btn';
    btn.textContent = '⚡ ANALYZE & LIST';
  }
}

// ── Render ─────────────────────────────────────────────────────────
function renderLog() {
  const list = document.getElementById('partsList');
  const count = document.getElementById('logCount');
  count.textContent = log.length ? \`\${log.length} item\${log.length!==1?'s':''}\` : '';
  if (!log.length) {
    list.innerHTML = \`<div class="empty">No items yet.<br>Add photos above and tap Analyze &amp; List.</div>\`;
    return;
  }
  list.innerHTML = log.map(p => cardHTML(p)).join('');
}

function cardHTML(p) {
  const thumbsHTML = (p.thumbs||[]).filter(Boolean).map(t =>
    \`<img class="photo-thumb" src="\${t}" alt="photo"/>\`
  ).join('');

  const fieldsHTML = PART_FIELDS.map(f => {
    const val = p[f.key];
    const empty = !val || val === 'not found';
    const cls = empty ? 'muted' : (f.accent ? 'accent' : '');
    return \`<div class="field">
      <div class="field-label">\${f.label}</div>
      <div class="field-value \${cls} editable" 
           onclick="editField(event,'\${p.id}','\${f.key}')" 
           id="fv-\${p.id}-\${f.key}">\${empty?'tap to edit':escHtml(val)}</div>
    </div>\`;
  }).join('');

  const notesHTML = p.notes ? \`<div class="field full">
    <div class="field-label">NOTES</div>
    <div class="field-value" style="font-size:11px;line-height:1.6">\${escHtml(p.notes)}</div>
  </div>\` : '';

  return \`<div class="part-card" id="card-\${p.id}">
    <div class="card-header" onclick="toggleCard('\${p.id}')">
      <span class="card-part-id">\${p.id}</span>
      <span class="card-timestamp">\${new Date(p.scannedAt).toLocaleString()}</span>
      <span class="card-toggle">▾</span>
      <button class="card-delete" onclick="deletePart(event,'\${p.id}')">🗑</button>
    </div>
    <div class="card-body">
      \${thumbsHTML ? \`<div class="photos-strip">\${thumbsHTML}</div>\` : ''}
      <div class="fields-grid">\${fieldsHTML}\${notesHTML}</div>
      <div class="ebay-section">
        <div class="ebay-header">— EBAY LISTING —</div>
        <div id="ebay-\${p.id}">\${ebayHTML(p.ebayListing, p.id)}</div>
      </div>
    </div>
  </div>\`;
}

function ebayHTML(listing, id) {
  if (!listing) return \`<div class="generating">Generating listing…</div>\`;
  if (listing.error) return \`<button class="retry-btn" onclick="retryListing('\${id}')">↺ Retry listing</button>\`;
  
  const price = listing.price || '';
  return \`<div class="ebay-card">
    <div class="ebay-title">\${escHtml(listing.title||'')}</div>
    <div class="ebay-price-row">
      <div class="ebay-price" id="price-display-\${id}">\${escHtml(price)}</div>
      <button class="price-edit-btn" onclick="editPrice('\${id}')">✏ Edit price</button>
    </div>
    <div id="price-input-\${id}" style="display:none">
      <div class="price-input-row">
        <input class="price-input" type="text" id="price-val-\${id}" value="\${escHtml(price)}" placeholder="e.g. 149.99"/>
        <button class="price-save" onclick="savePrice('\${id}')">SAVE</button>
      </div>
      \${listing.suggestedPriceReason ? \`<div style="font-size:10px;font-family:var(--mono);color:var(--ink3);margin-bottom:8px">💡 \${escHtml(listing.suggestedPriceReason)}</div>\` : ''}
    </div>
    <div class="ebay-meta">\${escHtml((listing.condition||'Used')+' · '+(listing.category||''))}</div>
    <div class="ebay-desc">\${escHtml(listing.description||'')}</div>
    \${listing.shippingNote ? \`<div class="ebay-ship">📦 \${escHtml(listing.shippingNote)}</div>\` : ''}
    <button class="ebay-list-btn" onclick="openEbay('\${id}')">LIST ON EBAY →</button>
  </div>\`;
}

function editPrice(id) {
  document.getElementById(\`price-input-\${id}\`).style.display = 'block';
  document.getElementById(\`price-val-\${id}\`).focus();
}

function savePrice(id) {
  const val = document.getElementById(\`price-val-\${id}\`).value.trim();
  const part = log.find(p=>p.id===id);
  if (part && part.ebayListing) {
    part.ebayListing.price = val;
    part.ebayListing.ebayUrl = buildEbayUrl(part.ebayListing);
    saveLog(log);
    document.getElementById(\`price-display-\${id}\`).textContent = val;
    document.getElementById(\`price-input-\${id}\`).style.display = 'none';
    showToast('Price updated!', 'success');
  }
}

function openEbay(id) {
  const part = log.find(p=>p.id===id);
  if (!part?.ebayListing) return;
  // Build fresh URL with current price
  const url = buildEbayUrl(part.ebayListing);
  window.open(url, '_blank');
  showToast('Opening eBay listing...', 'success');
}

function editField(e, partId, fieldKey) {
  e.stopPropagation();
  const el = document.getElementById(\`fv-\${partId}-\${fieldKey}\`);
  const current = log.find(p=>p.id===partId)?.[fieldKey] || '';
  el.innerHTML = \`<input type="text" value="\${escHtml(current==='not found'?'':current)}" 
    onblur="saveField('\${partId}','\${fieldKey}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur()"
    autofocus/>\`;
  el.querySelector('input').focus();
}

function saveField(partId, fieldKey, value) {
  const part = log.find(p=>p.id===partId);
  if (!part) return;
  part[fieldKey] = value || 'not found';
  saveLog(log);
  const el = document.getElementById(\`fv-\${partId}-\${fieldKey}\`);
  const field = PART_FIELDS.find(f=>f.key===fieldKey);
  const empty = !value;
  el.className = \`field-value \${empty?'muted':(field?.accent?'accent':'')} editable\`;
  el.textContent = empty ? 'tap to edit' : value;
  el.onclick = (ev) => editField(ev, partId, fieldKey);
}

function updateCardEbay(id, listing) {
  const el = document.getElementById(\`ebay-\${id}\`);
  if (el) el.innerHTML = ebayHTML(listing, id);
}

async function retryListing(id) {
  const part = log.find(p=>p.id===id);
  if (!part) return;
  updateCardEbay(id, null);
  try { part.ebayListing = await generateListingWithClaude(part, []); }
  catch { part.ebayListing = {error:true}; }
  saveLog(log);
  updateCardEbay(id, part.ebayListing);
}

function toggleCard(id) { document.getElementById(\`card-\${id}\`)?.classList.toggle('collapsed'); }

function deletePart(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this item?')) return;
  log = log.filter(p=>p.id!==id);
  saveLog(log);
  renderLog();
}

function exportCSV() {
  const headers = ['id','scannedAt',...PART_FIELDS.map(f=>f.key),'notes','ebayTitle','ebayPrice','ebayCategory'];
  const rows = log.map(p => headers.map(h => {
    const val = h.startsWith('ebay') ? 
      (h==='ebayTitle'?p.ebayListing?.title:h==='ebayPrice'?p.ebayListing?.price:p.ebayListing?.category)||'' 
      : (p[h]||'');
    return \`"\${val.toString().replace(/"/g,'""')}"\`;
  }).join(','));
  download('grand-medical-inventory.csv','text/csv',[headers.join(','),...rows].join('\n'));
}

function exportJSON() {
  const clean = log.map(({thumbs,...rest})=>rest);
  download('grand-medical-inventory.json','application/json',JSON.stringify(clean,null,2));
}

function download(name,type,content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; a.click();
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'visible ' + type;
  setTimeout(() => t.className = '', 3000);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
renderSlots();
renderLog();
</script>
</body>
</html>
